site_name: GPT_AITIS - Insurance Policy Analysis Documentation
site_description: Advanced insurance coverage determination using LLMs and RAG
site_author: Jean Pool Pereyra Principe
site_url: https://github.com/jean3P/GPT_AITIS
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Project Structure: getting-started/project-structure.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - Overview: user-guide/overview.md
    - Running Analysis: user-guide/running-analysis.md
    - Model Selection: user-guide/model-selection.md
    - RAG Strategies: user-guide/rag-strategies.md
    - Prompt Engineering: user-guide/prompts.md
    - Result Verification: user-guide/verification.md
    - Batch Processing: user-guide/batch-processing.md
  - Scripts & Tools:
    - Scripts Overview: scripts/overview.md
    - Main Pipeline: scripts/main.md
    - Evaluation Script: scripts/evaluate-results.md
    - Latex Script: scripts/latex-script.md
  - Architecture:
    - System Overview: architecture/overview.md
    - Model Architecture: architecture/models.md
    - RAG Pipeline: architecture/rag-pipeline.md
    - Vector Store: architecture/vector-store.md
    - Chunking Strategies: architecture/chunking.md
#  - Development:
#    - Development Setup: development/setup.md
#    - Adding New Models: development/new-models.md
#    - Custom RAG Strategies: development/custom-rag.md
#    - Creating Prompts: development/prompts.md
#  - Examples:
#    - Basic Examples: examples/basic.md
#  - Evaluation:
#    - Evaluation System: evaluation/overview.md
#    - Running Evaluations: evaluation/running-evaluations.md
#    - Metrics Explained: evaluation/metrics.md
  - Results:
      - Methodology: results/methodology.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
  - git-revision-date-localized:
      enable_creation_date: false
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jean3P/GPT_AITIS
extra_css:
  - stylesheets/hover-preview.css
extra_javascript:
  - javascripts/hover-preview.js
  - https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js
  - javascripts/mermaid.js